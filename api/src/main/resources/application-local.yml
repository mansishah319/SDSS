spring:
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-options-request: true
    static-path-pattern: /**
  config:
    activate:
      on-profile: local
  jmx:
    enabled: ${JMX_ENABLED:false}
  datasource:
    hikari:
      max-lifetime: 30000        # 30 seconds
      idle-timeout: 20000        # 20 seconds
      connection-timeout: 30000  # 30 seconds
      minimum-idle: 5
      maximum-pool-size: 10
    continue-on-error: true
    primary:
      jdbcUrl: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      driver-class-name: oracle.jdbc.OracleDriver
      password: DPHQ_SDSS
      username: dphq_sdss
    secondary:
      jdbcUrl: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      driver-class-name: oracle.jdbc.OracleDriver
      password: weblisher
      username: weblisher
    tertiary:
      jdbcUrl: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      driver-class-name: oracle.jdbc.OracleDriver
      password: committees
      username: committees
  jpa:
    database: default
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: ${OPEN_IN_VIEW:false}
    database-platform: org.hibernate.dialect.Oracle12cDialect
    properties:
      org:
        hibernate:
          envers:
            store_data_at_delete: ${ENVERS_STORE_DATA_AT_DELETE:true}
      hibernate:
        show_sql: false
        use_sql_comments: false
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 10
        order_inserts: false
        order_updates: false
        dialect: org.hibernate.dialect.Oracle12cDialect
        integration:
          envers:
            enabled: ${ENVERS_ENABLED:true}
        listeners:
          envers:
            autoRegister: ${ENVERS_AUTO_REGISTER:true}
    hibernate:
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
      dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.Oracle12cDialect}
      generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
  data:
    web:
      pageable:
        default-page-size: ${PAGINATION_DEFAULT_PAGE_SIZE:20}
        max-page-size: ${PAGINATION_MAX_PAGE_SIZE:2000}
        one-indexed-parameters: ${PAGINATION_ONE_INDEXED_PARAMETERS:true}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
      resolve-lazily: ${MULTIPART_RESOLVE_LAZILY:true}
  freemarker:
    template-loader-path: ${FREEMARKER_TEMPLATE_LOADER_PATH:classpath:/templates/}
    prefer-file-system-access: ${FREEMARKER_PREFER_FILE_SYSTEM_ACCESS:false}
    settings:
      recognize_standard_file_extensions: true
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.oracle.OracleDelegate
            tablePrefix: QRTZ_
            isClustered: true
            misfireThreshold: 60000
          threadPool:
            threadCount: 20
  mail:
    from: eng.mo.abdu@gmail.com
    default-encoding: UTF-8
    host: ${MAIL_HOST:smtp.gmail.com}
    username: ${MAIL_USERNAME:eng.mo.abdu@gmail.com}
    password: ${MAIL_PASSWORD:hesvlsokjikhhpux}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
          socketFactory:
            port: ${MAIL_SMTP_SOCKET_FACTORY_PORT:465}
            class: ${MAIL_SMTP_SOCKET_FACTORY_CLASS:javax.net.ssl.SSLSocketFactory}
          starttls:
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
        transport:
          protocol: ${MAIL_TRANSPORT_PROTOCOL:smtp}

# Open API
springdoc:
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}
  use-management-port: ${SPRINGDOC_USE_MANAGEMENT_PORT:false}
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/DubaiPolice/api-docs}
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/DubaiPolice/swagger-ui.html}
    tags-sorter: ${SWAGGER_UI_TAGS_SORTER:alpha}
    operations-sorter: ${SWAGGER_UI_OPERATIONS_SORTER:method}
    enabled: ${SWAGGER_UI_ENABLED:true}
    csrf:
      enabled: ${SWAGGER_UI_CSRF_ENABLED:true}

management:
  endpoints:
    web:
      base-path: ${MANAGEMENT_ENDPOINTS_WEB_BASE_PATH:/actuator}
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:*}
  #      path-mapping:
  #        health: actuator/health
  metrics:
    export:
      prometheus:
        enabled: true
  tags:
    application: ${spring.application.name}
  distribution:
    percentiles-histogram:
      http.server.requests: true
    percentiles:
      http.server.requests: 0.5,0.75,0.95,0.99
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
    info:
      enabled: ${MANAGEMENT_ENDPOINT_INFO_ENABLED:true}

logging:
  logback:
    rollingpolicy:
      file-name-pattern: ${LOGGING_ROLLING_FILE_NAME_PATTERN:logs/sdss-%d{yyyy-MM-dd}.%i.log}
      max-file-size: 50MB
  file:
    name: ${LOGGING_FILE_NAME:logs/sdss.log}
    path: ${LOGGING_FILE_PATH:.}
    max-history: ${MAX_HISTORY:30}
    max-size: ${LOGGING_MAX_FILE_SIZE:10MB}
    total-size-cap: ${LOGGING_TOTAL_SIZE_CAP:10MB}
  #    clean-history-on-start: ${LOGGING_clean_history_on_start:false}
  pattern:
    rolling-file-name: ${LOGGING_ROLLING_FILE_NAME:logs/sdss-%d{yyyy-MM-dd}.%i.log}
    console: ${LOGGING_PATTERN_CONSOLE:%cyan(%d{yyyy-MM-dd HH:mm:ss.SSS}) %highlight(%-5level) %magenta([%thread]) %green(%logger{15}) [%highlight(TraceId)=%yellow(%X{traceId}) %highlight(spanId)=%red(%X{spanId}) %highlight(UserGrpNumber)=%blue(%X{userId})] - %msg %n%throwable}
    file: ${LOGGING_PATTERN_FILE:%cyan(%d{yyyy-MM-dd HH:mm:ss.SSS}) %highlight(%-5level) %magenta([%thread]) %green(%logger{15}) [%highlight(TraceId)=%yellow(%X{traceId}) %highlight(spanId)=%red(%X{spanId}) %highlight(UserGrpNumber)=%blue(%X{userId})] - %msg %n%throwable}
  level:
    "com.zaxxer.hikari.pool.HikariPool": ERROR
    feign: debug
    root: ${LOGGING_ROOT:INFO}
    web: ${LOGGING_LEVEL_WEB:INFO}
    org.quartz: INFO
    hibernate:
      SQL: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.springframework.jdbc.core: DEBUG
    org.springframework.scheduling.quartz: INFO
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.jdbc.support.SQLErrorCodeSQLExceptionTranslator: INFO
    org.springframework.jdbc.support.SQLStateSQLExceptionTranslator: INFO
    com:
      zaxxer:
        hikari: INFO
      mgdsw:
        sdss: ${LOGGING_LEVEL_FOR_OUR_PROJECT:INFO}
      springdoc: ${LOGGING_LEVEL_SPRINGDOC:INFO}
      security:
        reactive: ${LOGGING_LEVEL_REACTIVE_SECURITY_AUTO_CONFIGURATION:INFO}
    org:
      springframework:
        security: INFO
        cloud:
          openfeign: DEBUG
        messaging: INFO
        web: INFO
      hibernate:
        SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:INFO}
        type:
          descriptor:
            sql:
              BasicBinder: ${LOGGING_LEVEL_HIBERNATE_BASIC_BINDER:INFO}

