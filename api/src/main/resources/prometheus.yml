global:
  scrape_interval: 5s #scrape every 5 seconds
  evaluation_interval: 5s #evaluate rules every 5 secs

scrape_configs:
  - job_name: 'sdss-application'
    metrics_path: '/sdss-service/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: [ '10.90.106.112:8082' ] # Replace it with your host and port
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: instance
        replacement: 'sdss-application'



# docker run -d --name prometheus -p 9090:9090 -v [full-path/prometheus.yml]:/etc/prometheus/prometheus.yml prom/prometheus