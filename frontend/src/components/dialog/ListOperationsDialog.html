<v-dialog v-model="internalShowDialog" max-width="600">
  <v-card>
    <v-card-title>
      <h2 class="headline">{{ title }}</h2>
      <v-spacer></v-spacer>
      <v-btn icon @click="closeDialog">
        <v-icon>mdi-close</v-icon>
      </v-btn>
    </v-card-title>
    <v-card-text class="dialog-scrollable">
      <slot></slot>
    </v-card-text>
  </v-card>
</v-dialog>
