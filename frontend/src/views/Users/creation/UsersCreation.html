<v-card class="custom-user-creation-screen-card-style">
  <v-card-title class="custom-user-creation-headline-title">
    <h2>{{ $t('user.add.title') }}</h2>
  </v-card-title>
  <v-card-text class="custom-user-creation-body-card-text">
    <!-- Validation Errors Summary -->
    <v-alert v-if="validationErrors.length > 0" type="error" variant="tonal" class="mb-4" closable>
      <template #title>
        <div class="d-flex align-center">
          <v-icon start>mdi-alert-circle</v-icon>
          {{ $t('common.validationErrors') }} ({{ validationErrors.length }})
        </div>
      </template>
      <div class="d-flex flex-wrap gap-2">
        <v-chip v-for="error in validationErrors" :key="error.field" color="error" variant="elevated" size="small">
          {{ error.message }}
        </v-chip>
      </div>
    </v-alert>

    <v-row>
      <!-- GRP Number Search -->
      <v-col cols="12" md="4">
        <v-row>
          <v-col :cols="!isGrpSearch ? 10 : 12">
            <v-text-field
              :placeholder="$t('user.search.list.grpNumber')"
              prepend-icon="mdi mdi-identifier"
              :append-inner-icon="isGrpSearch ? 'mdi mdi-magnify' : 'mdi mdi-magnify-remove-outline'"
              :disabled="!isGrpSearch"
              v-model="formData.grpNumber"
              density="default"
              variant="outlined"
              :rules="[validateMandatoryField(formData.grpNumber)]"
              :readonly="isGrpNumberReadOnly"
              @keyup.enter="fetchData"
              :error="validationErrors.some(e => e.field === 'grpNumber')"
            >
              <template #label>
                <div>
                  {{ $t('user.search.list.grpNumber') }}
                  <span style="color: red">*</span>
                </div>
              </template>
            </v-text-field>
          </v-col>

          <v-col cols="2" class="d-flex align-center justify-center">
            <v-btn density="compact" icon color="error" class="cancel-icon" @click="cancelSearch" v-if="!isGrpSearch">
              <v-icon>mdi-close</v-icon>
            </v-btn>
          </v-col>
        </v-row>
      </v-col>

      <!-- Roles Selection -->
      <v-col cols="12" md="4">
        <v-select
          v-model="selectedRoles"
          :items="availableRoles"
          prepend-icon="mdi mdi-security"
          item-value="id"
          item-title="localName"
          @change="moveRolesToSelected"
          variant="outlined"
          :rules="[validateMandatoryArrayField(selectedRolesAsStrings)]"
          :clearable="true"
          :multiple="true"
          :chips="true"
          closable-chips
          dense
          :error="validationErrors.some(e => e.field === 'roles')"
        >
          <template #label>
            <div>
              {{ $t('user.search.list.role') }}
              <span style="color: red">*</span>
            </div>
          </template>
        </v-select>
      </v-col>

      <!-- Language Selection -->
      <v-col cols="12" md="4">
        <v-autocomplete
          :placeholder="$t('user.add.language')"
          v-model="formData.language"
          :items="languageList"
          prepend-icon="mdi mdi-web-box"
          item-value="id"
          item-title="value"
          variant="outlined"
          density="default"
          :rules="[validateMandatoryField(formData.language)]"
          :clearable="true"
          required
          :error="validationErrors.some(e => e.field === 'language')"
        >
          <template #label>
            <div>
              {{ $t('user.add.language') }}
              <span style="color: red">*</span>
            </div>
          </template>
        </v-autocomplete>
      </v-col>

      <!-- Full Name -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.add.fullName')"
          :label="$t('user.add.fullName')"
          v-model="formData.fullName"
          :readonly="isGrpNumberReadOnly"
          prepend-icon="mdi mdi-pen"
          density="default"
          variant="outlined"
          required
        ></v-text-field>
      </v-col>

      <!-- Department -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.add.department')"
          :label="$t('user.add.department')"
          v-model="formData.shortDepartmentName"
          :readonly="isGrpNumberReadOnly"
          prepend-icon="mdi mdi-bank"
          density="default"
          variant="outlined"
        ></v-text-field>
      </v-col>

      <!-- Grade Name -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.add.gradeName')"
          :label="$t('user.add.gradeName')"
          v-model="formData.gradeName"
          prepend-icon="mdi mdi-account-school-outline"
          density="default"
          variant="outlined"
          :readonly="isGrpNumberReadOnly"
          required
        ></v-text-field>
      </v-col>

      <!-- Job Name -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.search.jobName')"
          :label="$t('user.add.jobName')"
          v-model="formData.jobName"
          prepend-icon="mdi mdi-briefcase-outline"
          density="default"
          variant="outlined"
          :readonly="isGrpNumberReadOnly"
          required
        ></v-text-field>
      </v-col>

      <!-- Email -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.search.email')"
          v-model="formData.email"
          prepend-icon="mdi mdi-email-edit-outline"
          density="default"
          variant="outlined"
          :readonly="isGrpNumberReadOnly"
          :rules="[validateMandatoryField(formData.email)]"
          required
          :error="validationErrors.some(e => e.field === 'email')"
        >
          <template #label>
            <div>
              {{ $t('user.search.email') }}
              <span style="color: red">*</span>
            </div>
          </template>
        </v-text-field>
      </v-col>

      <!-- Alternative Email -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.add.alternativeEmail')"
          :label="$t('user.add.alternativeEmail')"
          prepend-icon="mdi mdi-email-plus-outline"
          v-model="formData.alternativeEmail"
          density="default"
          variant="outlined"
          :clearable="true"
        ></v-text-field>
      </v-col>

      <!-- Mobile -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.search.mobile')"
          prepend-icon="mdi mdi-cellphone-basic"
          v-model="formData.mobile"
          density="default"
          variant="outlined"
          :readonly="isGrpNumberReadOnly"
          :rules="[validateMandatoryField(formData.mobile)]"
          required
          :error="validationErrors.some(e => e.field === 'mobile')"
        >
          <template #label>
            <div>
              {{ $t('user.search.mobile') }}
              <span style="color: red">*</span>
            </div>
          </template>
        </v-text-field>
      </v-col>

      <!-- Alternative Mobile -->
      <v-col cols="12" md="4">
        <v-text-field
          :placeholder="$t('user.add.alternativeMobile')"
          :label="$t('user.add.alternativeMobile')"
          prepend-icon="mdi mdi-phone-plus"
          v-model="formData.alternativeMobile"
          :clearable="true"
          density="default"
          variant="outlined"
        ></v-text-field>
      </v-col>

      <!-- Delphi Moderator Checkbox -->
      <v-col cols="12" md="4">
        <v-checkbox
          v-model="formData.isDelphiModerator"
          :label="$t('user.add.isDelphiModerator')"
          prepend-icon="mdi mdi-account-cog"
          color="primary"
          hide-details
        ></v-checkbox>
      </v-col>

      <!-- Expertises Section -->
      <v-col cols="12">
        <v-card class="custom-expert-user-creation-screen-card-style">
          <v-card-title class="custom-expert-user-creation-card-title">
            <h2>{{ $t('user.add.expertisesMainTitle') }}</h2>
          </v-card-title>
          <v-card-text class="custom-user-creation-body-card-text">
            <form>
              <v-row>
                <v-col cols="12" sm="6" md="3">
                  <v-select
                    v-model="usersExpertisesData.areaOfExpertisesId"
                    :items="localizedAvailableExpertises"
                    item-value="id"
                    item-title="name"
                    @change="moveRolesToSelected"
                    :label="$t('user.add.expertisesTitle')"
                    prepend-icon="mdi mdi-head-snowflake-outline"
                    variant="outlined"
                    :clearable="true"
                    dense
                  ></v-select>
                </v-col>
                <v-col cols="12" sm="6" md="3">
                  <v-autocomplete
                    :placeholder="$t('user.add.expertLevel')"
                    prepend-icon="mdi mdi-head-snowflake"
                    :clearable="true"
                    :label="$t('user.add.expertLevel')"
                    v-model="usersExpertisesData.expertLevel"
                    :items="expertiseLevels"
                    item-title="value"
                    item-value="id"
                    variant="outlined"
                    density="default"
                  ></v-autocomplete>
                </v-col>
                <v-col cols="12" sm="6" md="2">
                  <v-checkbox
                    v-model="usersExpertisesData.isPrimary"
                    :disabled="isAnyPrimaryExpertiseSelected"
                    prepend-icon="mdi mdi-key-star"
                    value="true"
                    :label="$t('common.default')"
                    type="checkbox"
                  ></v-checkbox>
                </v-col>
                <v-col cols="12" sm="6" md="2" class="d-flex align-center">
                  <v-btn class="me-4" type="submit" @click="submit($event)" color="primary">
                    {{ $t('common.submit') }}
                  </v-btn>
                </v-col>
              </v-row>
            </form>
          </v-card-text>
        </v-card>
      </v-col>

      <!-- Expertises Table -->
      <v-col cols="12">
        <v-data-table-server
          v-model:items-per-page="itemsPerPage"
          :headers="expertisesHeaders"
          :items="localizedSlicedData"
          :items-length="viewUsersExpertisesList.length"
          class="elevation-1"
          item-value="name"
          v-if="viewUsersExpertisesList.length > 0"
        >
          <template v-slot:item.actions="{ item }">
            <v-btn class="me-1" density="default" color="red" variant="tonal" @click="removeExpertise(item)">
              <i class="mdi mdi-trash-can"></i>
            </v-btn>
          </template>
        </v-data-table-server>

        <v-pagination
          v-model="currentPage"
          :length="Math.ceil(viewUsersExpertisesList.length / itemsPerPage)"
        ></v-pagination>
      </v-col>

      <!-- Permissions Section -->
      <v-row class="custom-permissions-user-creation-screen-card-style-row">
        <v-card class="custom-permissions-user-creation-screen-card-style">
          <v-card-title class="custom-permissions-user-creation-screen-card-style-title">
            <h3>{{ $t('user.add.permissionDetails') }}</h3>
          </v-card-title>
          <v-card-text>
            <v-container :fluid="true">
              <v-row>
                <v-checkbox
                  v-model="selectAll"
                  :label="$t('user.add.selectAll')"
                  hide-details
                  @change="toggleAllPermissions"
                ></v-checkbox>
              </v-row>
              <v-row>
                <v-col cols="12" sm="6" md="4">
                  <v-checkbox
                    v-model="formData.chatContents"
                    :label="$t('user.add.chatContents')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                  <v-checkbox
                    v-model="formData.decision"
                    :label="$t('user.add.decision')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                </v-col>
                <v-col cols="12" sm="6" md="4">
                  <v-checkbox
                    v-model="formData.internalDocuments"
                    :label="$t('user.add.internalDocuments')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                  <v-checkbox
                    v-model="formData.questionView"
                    :label="$t('user.add.questionView')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                </v-col>
                <v-col cols="12" sm="6" md="4">
                  <v-checkbox
                    v-model="formData.scrollingText"
                    :label="$t('user.add.scrollingText')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                  <v-checkbox
                    v-model="formData.socialMediaFeeds"
                    :label="$t('user.add.socialMediaFeeds')"
                    hide-details
                    @change="updateSelectAll"
                  ></v-checkbox>
                </v-col>
              </v-row>
            </v-container>
          </v-card-text>
        </v-card>
      </v-row>

      <v-col cols="12"></v-col>
    </v-row>

    <!-- Action Buttons -->
    <v-row>
      <v-col cols="12" sm="2"></v-col>
      <v-col cols="12" sm="3">
        <v-btn @click="submitForm" color="primary" prepend-icon="mdi mdi-check" large width="100%">
          {{ $t('user.add.Submit') }}
        </v-btn>
      </v-col>
      <v-col cols="12" sm="2"></v-col>
      <v-col cols="12" sm="3">
        <v-btn @click="cancelForm" color="error" prepend-icon="mdi mdi-close" width="100%" large>
          {{ $t('common.cancel') }}
        </v-btn>
      </v-col>
    </v-row>
  </v-card-text>
</v-card>
