<v-card class="search-card dp-card">
  <v-card-title>{{ $t('challenge.dashboard.research') }}</v-card-title>

  <v-divider></v-divider>

  <v-card-text class="spacing-side">
    <v-row class="search-type-row d-flex align-center">
      <v-col cols="12" sm="6" class="pa-0">
        <v-btn
          :block="true"
          flat
          :class="{'tab-btn-style': true,
                            'bg-secondary ':
                                searchType ===
                                ChallengeDashboardSearchType.INTERNAL,
                            'selected-button':
                                searchType ===
                                ChallengeDashboardSearchType.INTERNAL,
                        }"
          @click="
                            setSearchType(ChallengeDashboardSearchType.INTERNAL)
                        "
        >
          {{ $t('challenge.dashboard.internal') }}
        </v-btn>
      </v-col>
      <v-col cols="12" sm="6" class="pa-0">
        <v-btn
          :block="true"
          flat
          :class="{'tab-btn-style': true,
                                    'bg-primary ': searchType === ChallengeDashboardSearchType.YOUTUBE,
                                    'selected-button': searchType === ChallengeDashboardSearchType.YOUTUBE,
                               }"
          @click="setSearchType(ChallengeDashboardSearchType.YOUTUBE)"
        >
          {{ $t('challenge.dashboard.youtube') }}
        </v-btn>
      </v-col>
    </v-row>

    <v-text-field
      v-model="searchQuery"
      :label="$t('challenge.dashboard.researchText')"
      :single-line="true"
      append-icon="mdi-magnify"
      variant="outlined"
      density="compact"
      hide-details="auto"
      clearable
      class="dp-search-field"
      @click:append="performSearch"
      @keyup.enter="performSearch"
    ></v-text-field>

    <div>
      <template v-if="filteredFolders === null">
        <EmptyDataTable :imageSize="128" :message="$t('common.empty')"></EmptyDataTable>
      </template>

      <template v-else>
        <div v-if="searchType === ChallengeDashboardSearchType.INTERNAL" class="results-shell">
          <div class="results-stack result-download-list">
            <v-card v-for="(folder, index) in filteredFolders" :key="index" class="file-card" flat>
              <v-card-title class="card-title filtered-data-card-title">
                {{ folder.challengeId || 'No Challenge ID' }}
              </v-card-title>
              <v-card-text class="card-text">
                <div v-if="folder.documentsResponseList.length === 0">
                  <EmptyDataTable :imageSize="128" :message="$t('common.empty')"></EmptyDataTable>
                </div>
                <div v-else class="results-grid">
                  <div
                    v-for="(doc, docIndex) in folder.documentsResponseList"
                    :key="docIndex"
                    class="upload-list"
                    :class="['upload-card', { 'is-image': isTheTypeIsImageGeneric(doc.type) }]"
                  >
                    <div class="upload-img-div">
                      <img
                        v-if="isTheTypeIsImageGeneric(doc.type)"
                        :src="'data:image/' + doc.type + ';base64,' + doc.documentFile"
                        :alt="doc.name"
                        class="upload-img-preview"
                      />
                      <div v-else-if="isHTML(doc.type)" class="file-preview">
                        <v-icon size="90" color="green">mdi mdi-language-html5</v-icon>
                      </div>
                      <div v-else class="file-preview">
                        <v-icon v-if="isPdfGeneric(doc.type)" size="60" color="red">mdi-file-pdf-box</v-icon>
                        <v-icon v-else-if="isWordGeneric(doc.type)" size="60" color="blue">
                          mdi-file-word-box
                        </v-icon>
                        <v-icon v-else-if="isExcelGeneric(doc.type)" size="60" color="green">
                          mdi-file-excel-box
                        </v-icon>
                        <v-icon v-else size="60">mdi-file-outline</v-icon>
                      </div>
                    </div>
                    <span class="custom-doc-name-style font-semibold mt-3 text-center">{{ doc.name }}</span>
                    <v-card-actions>
                      <v-btn
                        class="download-btn"
                        variant="tonal"
                        color="primary"
                        @click="downloadFile(doc.name, doc.documentFile, doc.type)"
                      >
                        <v-icon start>mdi-download</v-icon>
                        {{ $t('common.download') }}
                      </v-btn>
                    </v-card-actions>
                  </div>
                </div>
              </v-card-text>
            </v-card>
          </div>
        </div>
      </template>
    </div>

    <div>
      <template v-if="searchType === ChallengeDashboardSearchType.YOUTUBE">
        <div v-if="filteredVideoFolders.length > 0" class="results-shell">
          <div class="results-stack">
            <v-card v-for="(folder, index) in filteredVideoFolders" :key="index" class="file-card" flat>
              <v-card-title class="card-title filtered-data-card-title">
                {{ folder.challengeId || 'No Challenge ID' }}
              </v-card-title>
              <v-card-text class="card-text">
                <div v-if="folder.videosResponseList.length === 0">
                  <EmptyDataTable :imageSize="128" :message="$t('common.empty')"></EmptyDataTable>
                </div>
                <div v-else class="results-grid video-results-grid">
                  <div
                    v-for="(video, videoIndex) in folder.videosResponseList"
                    :key="videoIndex"
                    class="upload-list"
                    @click="openDialog(video.link)"
                    :class="['upload-card', 'is-video']"
                  >
                    <div class="video-thumbnail-container">
                      <img
                        :src="getYouTubeThumbnailUrl(video.link)"
                        alt="YouTube Video Thumbnail"
                        class="upload-img-preview"
                      />
                      <v-icon class="play-button" size="48" color="white">mdi-play-circle</v-icon>
                    </div>
                  </div>
                </div>
              </v-card-text>
            </v-card>
          </div>
        </div>
      </template>
    </div>

    <!-- Video Player Dialog -->
    <v-dialog v-model="dialog" max-width="800px">
      <v-card>
        <v-card-title class="d-flex justify-center align-center">
          <img src="@/assets/images/logo/dp-logo.svg" alt="Logo" style="max-width: 150px; height: 150px" class="mr-4" />
        </v-card-title>

        <v-card-text>
          <iframe
            :src="`https://www.youtube.com/embed/${selectedVideoId}`"
            title="YouTube Video Player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            width="100%"
            height="400"
          ></iframe>
        </v-card-text>

        <v-card-actions class="d-flex justify-space-between align-center">
          <v-spacer></v-spacer>
          <v-btn icon @click="dialog = false" class="close-icon">
            <v-icon>{{ 'mdi-close' }}</v-icon>
          </v-btn>
        </v-card-actions>

        <v-card-subtitle class="text-center mt-4">{{ $t('common.copywriter') }}</v-card-subtitle>
      </v-card>
    </v-dialog>
  </v-card-text>
</v-card>
