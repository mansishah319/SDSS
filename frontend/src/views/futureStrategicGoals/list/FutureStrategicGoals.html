<div>
  <GenericDashboardHeaderView
    :title-en="$t('side_bar.settings.futureStrategicGoals.title')"
    :title-ar="$t('side_bar.settings.futureStrategicGoals.title')"
    subtitle-en="Track future challenge themes and keep downstream planning choices organized."
    subtitle-ar="تابع موضوعات التحديات المستقبلية وحافظ على تنظيم خيارات التخطيط اللاحقة."
    icon="mdi-flag-checkered"
    :show-back-button="true"
    back-route-name="home"
    :total-value="dtoResponse.length"
  />
  <v-card flat class="table-section-border">
    <v-card-title class="d-flex align-center pe-2 table-heading-vcard">
      <v-icon icon="mdi-video-input-component"></v-icon>
      &nbsp; {{ $t('settings.futureStrategicGoals.find') }}
      <v-spacer></v-spacer>
      <v-text-field
        v-model="search"
        density="compact"
        :label="$t('common.search')"
        prepend-inner-icon="mdi-magnify"
        variant="solo-filled"
        flat
        hide-details
        single-line
      ></v-text-field>
      <v-spacer></v-spacer>
      <v-btn class="ml-2 oval-button" color="green" @click="createNew">
        <v-icon left>mdi-plus</v-icon>
        {{ $t('common.create') }}
      </v-btn>
    </v-card-title>
    <template v-if="dtoResponse.length > 0">
      <v-data-table
        :headers="headers"
        :items="dtoResponse"
        :search="search"
        :loading="isLoading"
        :loading-text="$t('common.loading')"
        item-value="name"
        :items-per-page-text="$t('common.items_per_page')"
        :items-per-page-options="[
                                                  {value: 10, title: '10'},
                                                  {value: 25, title: '25'},
                                                  {value: 50, title: '50'},
                                                  {value: 100, title: '100'},
                                                  {value: -1, title: $t('common.allPages')}
                                                ]"
        class="elevation-0"
      >
        <template v-slot:item.actions="{ item }">
          <v-btn class="me-1" density="default" color="yellow" variant="tonal" @click="openEditDialog(item.id)">
            <i class="mdi mdi-pencil"></i>
          </v-btn>
          <v-btn class="me-1" density="default" color="red" variant="tonal" @click="openDeleteDialog(item.id)">
            <i class="mdi mdi-trash-can"></i>
          </v-btn>
        </template>
      </v-data-table>
    </template>
    <!-- Show empty table component when dtoResponse is empty -->
    <template v-else>
      <EmptyDataTable :imageSize="128" :message="$t('common.empty')"></EmptyDataTable>
    </template>

    <!-- CreateNew page -->
    <AppDialogShell
      :model-value="showCreateNewPage"
      :title="$t('settings.futureStrategicGoals.add')"
      subtitle="Create future-goal entries in the same contemporary settings dialog language."
      icon="mdi-flag-checkered"
      :max-width="760"
      @update:modelValue="showCreateNewPage = $event"
      @close="showCreateNewPage = false"
    >
      <CreateNewStrategicGoals
        @close="showCreateNewPage = false"
        @templateUpdated="refreshTemplateList"
      ></CreateNewStrategicGoals>
    </AppDialogShell>

    <!-- Edit Dialog -->
    <AppDialogShell
      :model-value="showEditDialog"
      :title="$t('settings.futureStrategicGoals.edit')"
      subtitle="Edit future-goal entries while preserving the same modern interaction style."
      icon="mdi-flag-checkered"
      :max-width="760"
      @update:modelValue="showEditDialog = $event"
      @close="showEditDialog = false"
    >
      <EditStrategicGoals
        :gId="selectedId"
        @close="showEditDialog = false"
        @templateUpdated="refreshTemplateList"
      ></EditStrategicGoals>
    </AppDialogShell>

    <ConfirmationDialog
      v-if="deleteDialog"
      :title="$t('common.deletionTitle')"
      :message="$t('common.deleteConfirmation')"
      icon="mdi-trash-can-outline"
      icon-color="error"
      confirm-button-color="error"
      :confirm-text="$t('common.delete')"
      @confirmed="confirmDeletion"
      @cancel="cancelDeletion"
    />
  </v-card>
</div>
