<AppHeader :is-sdss-user-authorized="canAccessSdssHomepage"></AppHeader>

<BannerView :banner-image="bannerImg" :show-hide-button="true" :auto-hide="false" home-type="main"></BannerView>

<!-- Loading State -->
<DubaiPoliceLoader :is-loading="isLoading" />

<div class="dashboard-section" :dir="isRTL ? 'rtl' : 'ltr'">

  <!-- Error State -->
  <div v-if="error" class="error-container">
    <v-alert type="error" variant="tonal" class="error-alert">
      <template #prepend>
        <v-icon>mdi-alert-circle</v-icon>
      </template>
      <div class="error-content">
        <h3>{{ $t('Messages.error.general.serviceDown') }}</h3>
        <p>{{ error }}</p>
        <v-btn color="primary" variant="elevated" @click="refreshData" :loading="isLoading" class="retry-btn">
          <v-icon start>mdi-refresh</v-icon>
          {{ $t('common.refresh') }}
        </v-btn>
      </div>
    </v-alert>
  </div>

  <!-- Main Content -->
  <template v-else>
    <div class="home-services-block">
      <div class="home-services-block-heading">
        <img src="@/assets/images/variety/apps-icon.svg" class="img-1" alt="apps-icon" />
        <h3>{{ $t('home.myServices') }}</h3>
        <v-tooltip location="top">
          <template v-slot:activator="{ props }">
            <span v-bind="props">
              <img src="@/assets/images/actions/info-icon.svg" class="img-2" alt="info-icon" />
            </span>
          </template>
          <span>{{ $t('home.servicesInfo') }}</span>
        </v-tooltip>
      </div>

      <div class="card-wrapper">
        <div class="card">
          <div class="home-services-block-grid">

            <router-link v-for="(category, index) in authorizedCategories" :key="index" :to="category.route"
                         class="service-link"
                         :class="{ 'premium-service': category.isPremium }"
                         @click="handleWhenAppearSideBar(category.route)">
              <div class="home-services-block-list">
                <div class="home-services-block-list-icon d-flex justify-center">
                  <!-- Check if icon is an image URL (contains http, https, or starts with / or assets) -->
                  <img
                    v-if="category.icon && (category.icon.startsWith('http') || category.icon.startsWith('/') || category.icon.includes('assets'))"
                    :src="category.icon"
                    :alt="category.title"
                    class="custom-image-icon"
                    :style="{ width: category.iconSize === 'x-large' ? '48px' : '32px', height: 'auto' }"
                  />
                  <!-- Otherwise use Vuetify icon for Material Icons -->
                  <v-icon
                    v-else
                    :color="category.color || 'primary'"
                    :size="category.iconSize || 'default'"
                    class="service-icon"
                  >
                    {{ category.icon }}
                  </v-icon>
                </div>
                <div class="home-services-block-list-title">
                  {{ category.title }}
                  <v-icon v-if="category.isPremium" class="premium-icon" color="warning">mdi-star</v-icon>
                </div>
              </div>
            </router-link>

          </div>
        </div>
      </div>
    </div>

    <div class="home-dashboard-block">
      <div class="home-dashboard-block-heading">
        <img src="@/assets/images/variety/auto_graph-icon.svg" class="img-1" alt="auto_graph-icon" />
        <h3>{{ $t('home.statistics') }}</h3>
        <v-tooltip location="top">
          <template v-slot:activator="{ props }">
            <span v-bind="props">
              <img src="@/assets/images/actions/info-icon.svg" class="img-2" alt="info-icon" />
            </span>
          </template>
          <span>{{ $t('home.statisticsInfo') }}</span>
        </v-tooltip>
      </div>

      <div class="card-wrapper">
        <div class="home-dashboard-grid">

          <div class="home-dashboard-card total-fines">
            <div class="card-content">
              <div class="content-left">
                <div class="card-icon">
                  <v-icon color="red">mdi-fencing</v-icon>
                </div>
                <div class="home-dashboard-card-title">{{ $t('common.allChallengesCount') }}</div>

              </div>
              <div class="fine-numbers">
                <div class="home-dashboard-card-stats">{{ mainHomeScreenResponse.totalChallengesCount || 0 }}</div>

              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 100%"></div>
            </div>
          </div>

          <div class="home-dashboard-card paid-fines">
            <div class="card-content">
              <div class="content-left">
                <div class="card-icon">
                  <v-icon color="#008755">mdi-checkbox-multiple-outline</v-icon>
                </div>
                <div class="home-dashboard-card-title">{{ $t('common.totalSurveysCount') }}</div>

              </div>
              <div class="fine-numbers">
                <div class="home-dashboard-card-stats">{{ mainHomeScreenResponse.totalSurveysCount || 0 }}</div>
              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 100%"></div>
            </div>
          </div>

          <div class="home-dashboard-card pending-fines">
            <div class="card-content">
              <div class="content-left">
                <div class="card-icon">
                  <v-icon color="#1570EF">mdi-account-tie</v-icon>
                </div>
                <div class="home-dashboard-card-title">{{ $t('common.allInternalUsersCount') }}</div>

              </div>
              <div class="fine-numbers">
                <div class="home-dashboard-card-stats">{{ mainHomeScreenResponse.totalInternalUsersCount || 0 }}</div>

              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 100%"></div>
            </div>
          </div>

          <div class="home-dashboard-card rejected-fines">
            <div class="card-content">
              <div class="content-left">
                <div class="card-icon">
                  <v-icon color="#FDB022">mdi-earth</v-icon>
                </div>
                <div class="home-dashboard-card-title">{{ $t('common.allExternalUsersCount') }}</div>

              </div>
              <div class="fine-numbers">
                <div class="home-dashboard-card-stats">{{ mainHomeScreenResponse.totalExternalUsersCount || 0 }}</div>

              </div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: 100%"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>
</div>

<FooterComponent class="home-page-footer" />
